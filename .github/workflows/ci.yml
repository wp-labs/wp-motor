name: CI

on:
  push:
    branches:
      - "*"
      - "hotfix/*"
    tags:
      - "*"
  pull_request:
    branches:
      - "*"
      - "hotfix/*"

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable, beta]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features -- --test-threads=1

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    # audit-check 会把结果写成一个 check run；未显式声明时
    # GITHUB_TOKEN 只有默认权限，创建 check run 会被拒：
    # "Resource not accessible by integration"。
    # 声明 permissions 还会把本 job 其余权限降为 none。
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - run: cargo generate-lockfile
      # RUSTSEC-2026-0459 豁免的前提是「链接系统 SQLite」：构建图里不得出现
      # libsqlite3-sys 的 `bundled` 特性（它会把内置的 SQLite <3.54.0 编进来）。
      # 一旦有人给 rusqlite 打开了 bundled，豁免立刻变成真实风险，必须拦住。
      # 注意用 `grep -c` 而不是 `grep -q`：后者提前退出会让 cargo tree 收到
      # SIGPIPE，在 set -o pipefail 下反把判断结果变成 false。
      - name: Guard - sqlite must stay unbundled
        run: |
          set -uo pipefail
          bundled=$(cargo tree -e features | grep -c 'libsqlite3-sys feature "bundled"' || true)
          if [ "${bundled:-0}" -gt 0 ]; then
            echo "::error::libsqlite3-sys/bundled 被启用，RUSTSEC-2026-0459 的豁免前提失效"
            cargo tree -e features -i libsqlite3-sys
            exit 1
          fi
          echo "ok: libsqlite3-sys 未启用 bundled（链接系统 SQLite）"
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage report
        run: |
          cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info -- --test-threads=1
          echo "Coverage file generated:"
          ls -la lcov.info
          echo "File size: $(wc -c < lcov.info) bytes"

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./lcov.info
          flags: unittests
          name: coverage-${{ github.ref_name }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: ${{ github.event_name == 'push' }}
          verbose: true
