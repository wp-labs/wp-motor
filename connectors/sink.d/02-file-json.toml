[[connectors]]
id = "file_json_sink"
type = "file"
allow_override = ["base","file","compression","encryption","max_size","max_rolls","roll_compress"]
[connectors.params]
fmt  = "json"
base = "./data/out_dat"
file = "default.json"
# 注意：max_size / max_rolls / roll_compress 只列入 allow_override，不要在这里给默认值。
# merge_params 要求覆盖值类型与默认值一致，默认成整数 0 会让 max_size = "10MB" 被拒绝。
